[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
enforce_domain = false

[paths]
data = /var/lib/juicefs-portal/grafana
logs = /var/log/juicefs-portal/grafana
plugins = /var/lib/juicefs-portal/grafana/plugins
provisioning = /etc/juicefs-portal/grafana/provisioning

[security]
admin_user = jfsportal-admin
disable_gravatar = true
cookie_secure = false
cookie_samesite = strict
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
plugin_admin_enabled = false

[log]
mode = console
level = info
