global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: juicefs-prod
    monitor: portal-152

# T05 starts with self-monitoring only. T06 adds cluster targets after each
# endpoint and label contract is verified.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
